[package]
name = "agentmaster"
version = "0.10.0"
edition = "2024"
rust-version = "1.95"
description = "See and steer every agent from one session — Kanban TUI, zero orchestration tax"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
portable-pty = "0.9.0"
ratatui = "0.30.0"
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39.3"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
